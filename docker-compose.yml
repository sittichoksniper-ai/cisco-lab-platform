version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cisco-lab-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cisco_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cisco_password}
      POSTGRES_DB: ${DB_NAME:-cisco_lab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cisco_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cisco-lab-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cisco-lab-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-cisco_user}:${DB_PASSWORD:-cisco_password}@postgres:5432/${DB_NAME:-cisco_lab}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      API_PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cisco-lab-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
